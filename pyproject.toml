[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory-buffer"
version = "0.2.0"
description = "MCP server providing a temporal and state-aware semantic memory buffer for agentic LLMs (MATP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2,<2",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

